<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MAKER">
  <meta name="theme-color" content="#ff2d55">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>MAKER // Build It All</title>
  <style>
    :root {
      --bg: #0a0a0a; --surface: #141414; --border: #2a2a2a; --text: #e8e8e8;
      --muted: #888; --accent: #ff2d55; --accent-dim: #cc1f42;
      --user-bg: #1f1f1f; --ai-bg: #161616;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      overflow: hidden;
    }
    #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; }
    header {
      padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    header h1 { font-size: 17px; font-weight: 700; }
    header h1 span { color: var(--accent); }
    .header-actions { display: flex; gap: 4px; }
    button.icon { background: transparent; border: none; color: var(--muted); font-size: 18px; padding: 8px; cursor: pointer; }
    #chips {
      display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
      -webkit-overflow-scrolling: touch;
    }
    .chip {
      flex-shrink: 0; padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .chip.active { border-color: var(--accent); color: var(--accent); }
    #messages {
      flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .msg {
      max-width: 92%; padding: 12px 14px; border-radius: 16px; line-height: 1.45;
      font-size: 15px; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user { align-self: flex-end; background: var(--user-bg); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
    .msg.ai { align-self: flex-start; background: var(--ai-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.ai .label { font-size: 11px; color: var(--accent); margin-bottom: 4px; font-weight: 600; letter-spacing: 0.5px; }
    .msg.ai .err { color: #ff6b6b; }
    .typing { display: flex; gap: 4px; padding: 8px 0; }
    .typing span { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }
    #input-area {
      padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
    }
    #prompt {
      flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 20px;
      padding: 12px 16px; color: var(--text); font-size: 16px; resize: none; max-height: 120px;
      outline: none; font-family: inherit;
    }
    #prompt:focus { border-color: var(--accent); }
    #send {
      background: var(--accent); border: none; width: 44px; height: 44px; border-radius: 50%;
      color: white; font-size: 18px; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; cursor: pointer;
    }
    #send:disabled { opacity: 0.4; }
    .settings-panel {
      display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg); z-index: 100; padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top)); overflow-y: auto;
    }
    .settings-panel.open { display: block; }
    .settings-panel h2 { margin-bottom: 8px; font-size: 20px; }
    .settings-panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .settings-panel label { display: block; margin: 12px 0 4px; color: var(--muted); font-size: 13px; }
    .settings-panel input, .settings-panel select, .settings-panel textarea {
      width: 100%; padding: 12px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 15px; font-family: inherit;
    }
    .settings-panel textarea { min-height: 80px; }
    .settings-panel .btn-row { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .settings-panel button.primary {
      width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 12px;
      color: white; font-size: 16px; font-weight: 600;
    }
    .settings-panel button.secondary {
      width: 100%; padding: 12px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); font-size: 14px;
    }
    .empty {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--muted); text-align: center; padding: 40px 20px;
    }
    .empty h2 { color: var(--text); margin-bottom: 8px; font-size: 22px; }
    .empty p { font-size: 15px; line-height: 1.5; max-width: 300px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>MA<span>KER</span></h1>
      <div class="header-actions">
        <button class="icon" id="btn-export" title="Export">⬇️</button>
        <button class="icon" id="btn-clear" title="Clear">🗑</button>
        <button class="icon" id="btn-settings" title="Settings">⚙️</button>
      </div>
    </header>
    <div id="chips">
      <button class="chip active" data-preset="all">All projects</button>
      <button class="chip" data-preset="burnbox">Burn Box</button>
      <button class="chip" data-preset="bubbles">Bubbles</button>
      <button class="chip" data-preset="partition">Partitioner</button>
      <button class="chip" data-preset="handofgod">HandOfGod</button>
      <button class="chip" data-preset="cli">Grok CLI</button>
    </div>
    <div id="messages">
      <div class="empty" id="empty-state">
        <h2>Build it all</h2>
        <p>MAKER is the forge. Pick a project chip, set your API key, then order the next build step.</p>
      </div>
    </div>
    <div id="input-area">
      <textarea id="prompt" rows="1" placeholder="What do we build next?" enterkeyhint="send"></textarea>
      <button id="send">↑</button>
    </div>
  </div>
  <div class="settings-panel" id="settings">
    <h2>MAKER Settings</h2>
    <p class="sub">Forge for Toolaid · key stays on device</p>
    <label>xAI API Key</label>
    <input type="password" id="api-key" placeholder="xai-..." autocomplete="off">
    <label>Model</label>
    <select id="model">
      <option value="grok-4.6">grok-4.6 (flagship)</option>
      <option value="grok-4.5">grok-4.5</option>
      <option value="grok-4.3">grok-4.3</option>
      <option value="grok-4">grok-4</option>
    </select>
    <label>Extra system notes (optional)</label>
    <textarea id="system-extra" placeholder="Any standing orders for the forge..."></textarea>
    <div class="btn-row">
      <button class="primary" id="save-settings">Save &amp; Close</button>
      <button class="secondary" id="btn-test">Test API key</button>
      <button class="secondary" id="btn-import">Import chat JSON</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <button class="secondary" id="btn-close-settings">Cancel</button>
    </div>
  </div>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    }

    var PRESETS = {
      all: {
        label: "All projects",
        system:
          "You are MAKER / Siren, LowC's forge partner in T00l-AID. Mission: design, sequence, and write the code/docs/commands to build the whole stack.\n" +
          "Active portfolio:\n" +
          "1) Burn Box (Stage 2 complete) — sanitized vault; Stage 3 optional.\n" +
          "2) Bubbles / Android-as-Guest — shrink original OS into a controlled bubble; theory on GitHub SirenForge-Android-Guest.\n" +
          "3) SirenForge partitioner — GPT plan/shrink when write access exists.\n" +
          "4) HandOfGod — automation / keyboard agent tooling.\n" +
          "5) MAKER itself — this PWA + later Flutter/tools.\n" +
          "6) Grok Build CLI — terminal agent on the laptop (command: grok).\n" +
          "Rules: Be concrete. Prefer file paths, shell commands, GitHub pushes, phased checklists. No fake claims of scanning the user's laptop. When code is needed, output complete copy-pasteable files. LowC is in Toronto/GTA; SuperGrok user. Build it all — one clear next step at a time unless asked for a full plan."
      },
      burnbox: {
        label: "Burn Box",
        system:
          "You are MAKER focused on Burn Box (xxlowcxx/burn-box-stage-1). Stage 2 is complete: quarantine	o scan	o burn original	o safe store, multi-platform shells, convert, large-file policy. Help with Stage 3: unify routes-core, CDR, resumable uploads, performance. Give exact file paths under server/ client/ shared/."
      },
      bubbles: {
        label: "Bubbles",
        system:
          "You are MAKER focused on Bubbles + Android-as-Guest (xxlowcxx/SirenForge-Android-Guest). Goal: capture OS image, shrink, place in virtual bubble, free space is playground; original intact. Prefer Gunyah/AVF research paths over cracking. Produce roadmap steps, capture scripts outlines, host design — no unauthorized device attacks."
      },
      partition: {
        label: "Partitioner",
        system:
          "You are MAKER focused on SirenForge GPT/partition tooling. Plan partitions like GParted when write access exists; never claim full GPT rewrite on locked modern Samsung without a real programmer/foothold. Output parsers, planners, safety CRC notes, CLI designs."
      },
      handofgod: {
        label: "HandOfGod",
        system:
          "You are MAKER focused on HandOfGod / automation agents (keyboard, scripts, supervised AI control). Emphasize user-owned devices, explicit supervision, no unsupervised abuse. Deliver script structure, safety rails, and integration with MAKER."
      },
      cli: {
        label: "Grok CLI",
        system:
          "You are MAKER coaching use of xAI Grok Build CLI in Kitty/terminal. Commands: curl install, PATH ~/.grok/bin, grok, grok -p, grok login, XAI_API_KEY. Help debug path issues and pair CLI hands with MAKER brain."
      }
    };

    var messagesEl = document.getElementById("messages");
    var promptEl = document.getElementById("prompt");
    var sendBtn = document.getElementById("send");
    var emptyState = document.getElementById("empty-state");
    var settingsPanel = document.getElementById("settings");
    var history = JSON.parse(localStorage.getItem("maker_history") || "[]");
    var isStreaming = false;
    var activePreset = localStorage.getItem("maker_preset") || "all";

    function loadSettings() {
      document.getElementById("api-key").value = localStorage.getItem("xai_key") || "";
      var m = localStorage.getItem("xai_model") || "grok-4.6";
      document.getElementById("model").value = m;
      document.getElementById("system-extra").value = localStorage.getItem("maker_extra") || "";
    }
    loadSettings();

    function setPreset(id) {
      activePreset = id;
      localStorage.setItem("maker_preset", id);
      document.querySelectorAll(".chip").forEach(function (c) {
        c.classList.toggle("active", c.getAttribute("data-preset") === id);
      });
    }
    document.querySelectorAll(".chip").forEach(function (c) {
      c.onclick = function () { setPreset(c.getAttribute("data-preset")); };
    });
    setPreset(activePreset);

    function buildSystem() {
      var base = (PRESETS[activePreset] || PRESETS.all).system;
      var extra = localStorage.getItem("maker_extra") || "";
      if (extra.trim()) base += "\n\nStanding orders from LowC:\n" + extra.trim();
      return base;
    }

    function saveSettings() {
      localStorage.setItem("xai_key", document.getElementById("api-key").value.trim());
      localStorage.setItem("xai_model", document.getElementById("model").value);
      localStorage.setItem("maker_extra", document.getElementById("system-extra").value);
      settingsPanel.classList.remove("open");
    }
    document.getElementById("btn-settings").onclick = function () { settingsPanel.classList.add("open"); };
    document.getElementById("save-settings").onclick = saveSettings;
    document.getElementById("btn-close-settings").onclick = function () { settingsPanel.classList.remove("open"); };

    document.getElementById("btn-test").onclick = async function () {
      var key = document.getElementById("api-key").value.trim();
      if (!key) { alert("Paste an API key first."); return; }
      try {
        var res = await fetch("https://api.x.ai/v1/models", { headers: { Authorization: "Bearer " + key } });
        var body = await res.text();
        if (!res.ok) throw new Error(res.status + " " + body.slice(0, 200));
        alert("API key works.");
        localStorage.setItem("xai_key", key);
      } catch (e) {
        alert("Key test failed: " + e.message);
      }
    };

    document.getElementById("btn-clear").onclick = function () {
      if (confirm("Wipe chat history?")) {
        history = [];
        localStorage.removeItem("maker_history");
        messagesEl.innerHTML = "";
        messagesEl.appendChild(emptyState);
        emptyState.style.display = "flex";
      }
    };

    document.getElementById("btn-export").onclick = function () {
      var blob = new Blob([JSON.stringify({ app: "MAKER", preset: activePreset, history: history }, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "maker-chat-" + Date.now() + ".json";
      a.click();
    };

    document.getElementById("btn-import").onclick = function () { document.getElementById("import-file").click(); };
    document.getElementById("import-file").onchange = function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var data = JSON.parse(reader.result);
          var list = Array.isArray(data) ? data : data.history;
          if (!Array.isArray(list)) throw new Error("No history array");
          history = list;
          localStorage.setItem("maker_history", JSON.stringify(history.slice(-40)));
          messagesEl.innerHTML = "";
          emptyState.style.display = history.length ? "none" : "flex";
          if (history.length) renderHistory();
          else messagesEl.appendChild(emptyState);
          settingsPanel.classList.remove("open");
        } catch (err) {
          alert("Import failed: " + err.message);
        }
      };
      reader.readAsText(file);
    };

    promptEl.addEventListener("input", function () {
      promptEl.style.height = "auto";
      promptEl.style.height = Math.min(promptEl.scrollHeight, 120) + "px";
    });

    function escapeHtml(text) {
      var div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function renderHistory() {
      if (!history.length) return;
      emptyState.style.display = "none";
      history.forEach(function (m) {
        var div = document.createElement("div");
        div.className = "msg " + m.role;
        if (m.role === "ai") div.innerHTML = '<div class="label">MAKER</div>' + escapeHtml(m.content);
        else div.textContent = m.content;
        messagesEl.appendChild(div);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    renderHistory();

    async function send() {
      var text = promptEl.value.trim();
      if (!text || isStreaming) return;
      var key = localStorage.getItem("xai_key");
      if (!key) {
        alert("API key required — Settings.");
        settingsPanel.classList.add("open");
        return;
      }

      emptyState.style.display = "none";
      promptEl.value = "";
      promptEl.style.height = "auto";

      var userDiv = document.createElement("div");
      userDiv.className = "msg user";
      userDiv.textContent = text;
      messagesEl.appendChild(userDiv);
      history.push({ role: "user", content: text });
      localStorage.setItem("maker_history", JSON.stringify(history.slice(-40)));

      var aiDiv = document.createElement("div");
      aiDiv.className = "msg ai";
      aiDiv.innerHTML = '<div class="label">MAKER · ' + (PRESETS[activePreset] || PRESETS.all).label + '</div><div class="typing"><span></span><span></span><span></span></div>';
      messagesEl.appendChild(aiDiv);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      isStreaming = true;
      sendBtn.disabled = true;

      var model = localStorage.getItem("xai_model") || "grok-4.6";
      var messages = [{ role: "system", content: buildSystem() }];
      history.slice(-12).forEach(function (m) {
        messages.push({ role: m.role === "ai" ? "assistant" : "user", content: m.content });
      });
      var payload = { model: model, messages: messages, temperature: 0.7 };

      try {
        var res = await fetch("https://api.x.ai/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
          body: JSON.stringify(Object.assign({}, payload, { stream: true }))
        });

        if (!res.ok) {
          var errText = await res.text();
          var res2 = await fetch("https://api.x.ai/v1/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
            body: JSON.stringify(Object.assign({}, payload, { stream: false }))
          });
          if (!res2.ok) {
            var err2 = await res2.text();
            throw new Error("HTTP " + res2.status + ": " + (err2 || errText).slice(0, 400));
          }
          var data = await res2.json();
          var full = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "(empty)";
          aiDiv.innerHTML = '<div class="label">MAKER</div>' + escapeHtml(full);
          history.push({ role: "ai", content: full });
          localStorage.setItem("maker_history", JSON.stringify(history.slice(-40)));
          return;
        }

        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var full = "";
        var buffer = "";
        aiDiv.innerHTML = '<div class="label">MAKER</div>';
        while (true) {
          var step = await reader.read();
          if (step.done) break;
          buffer += decoder.decode(step.value, { stream: true });
          var lines = buffer.split("\n");
          buffer = lines.pop() || "";
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i].trim();
            if (line.indexOf("data: ") !== 0) continue;
            var dataStr = line.slice(6);
            if (dataStr === "[DONE]") continue;
            try {
              var json = JSON.parse(dataStr);
              var delta = (json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content) || "";
              if (delta) {
                full += delta;
                aiDiv.innerHTML = '<div class="label">MAKER</div>' + escapeHtml(full);
                messagesEl.scrollTop = messagesEl.scrollHeight;
              }
            } catch (ignore) {}
          }
        }
        if (!full) {
          aiDiv.innerHTML = '<div class="label">MAKER</div><span class="err">Empty reply. Test API key / try grok-4.6.</span>';
        } else {
          history.push({ role: "ai", content: full });
          localStorage.setItem("maker_history", JSON.stringify(history.slice(-40)));
        }
      } catch (e) {
        aiDiv.innerHTML = '<div class="label">MAKER</div><span class="err">Error: ' + escapeHtml(e.message) + "</span>";
      } finally {
        isStreaming = false;
        sendBtn.disabled = false;
      }
    }

    sendBtn.onclick = send;
    promptEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
